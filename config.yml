app:
  name: "Commodity Finance Assistance"
  environment: "development"
  log_level: "INFO"

llm:
  default_provider: "openai"

  providers:
    openai:
      api_key_env: "OPENAI_API_KEY"
      base_url: null
      timeout: 60
      max_retries: 2

  models:
    chat:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.2
      max_tokens: 2000

    reasoning:
      provider: "openai"
      model: "gpt-4.1"
      temperature: 0.1
      max_tokens: 4000

    embeddings:
      provider: "openai"
      model: "text-embedding-3-small"
      dimensions: 1536

    extraction:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 2000

    evaluation:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 2000

database:
  provider: "postgresql"
  url_env: "DATABASE_URL"
  pool_size: 5
  max_overflow: 10

retrieval:
  embedding_model: "text-embedding-3-small"
  top_k: 5
  score_threshold: 0.7

observability:
  enabled: true
  log_prompts: false
  log_responses: false