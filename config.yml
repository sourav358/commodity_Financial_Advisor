app:
  name: "Commodity Finance Assistance"
  environment: "development"
  log_level: "INFO"

llm:
  default_provider: "openai"

  providers:
    openai:
      api_key_env: "OPENAI_API_KEY"
      base_url: null
      timeout: 60
      max_retries: 2

  models:
    chat:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.2
      max_tokens: 2000

    reasoning:
      provider: "openai"
      model: "gpt-4.1"
      temperature: 0.1
      max_tokens: 4000

    embeddings:
      provider: "openai"
      model: "text-embedding-3-small"
      dimensions: 1536

    extraction:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 2000

    evaluation:
      provider: "openai"
      model: "gpt-4.1-mini"
      temperature: 0.0
      max_tokens: 2000


database:
  provider: "sqlite"
  url: "sqlite:///data/commodity_finance.db"
  echo: false

memory:
  provider: "local"
  conversation:
    enabled: true
    max_messages: 20
  persistence:
    enabled: true
    store: "sqlite"


retrieval:
  embedding_model: "text-embedding-3-small"
  top_k: 5
  score_threshold: 0.7

observability:
  enabled: true
  log_prompts: false
  log_responses: false
mcp:
  enabled: true

  servers:
    commodity:
      transport: "stdio"
      command: "poetry"
      args:
        - "run"
        - "python"
        - "-m"
        - "commodity_finance_assistance.mcp.server"
      timeout: 30
 
  enabled: true

  servers:
    commodity:
      transport: "stdio"
      command: "poetry"
      args:
        - "run"
        - "python"
        - "-m"
        - "commodity_finance_assistance.mcp.server"
      timeout: 30